[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envirocare-crew"
version = "1.0.0"
description = "EnviroCare multi-agent competitive intelligence crew powered by CrewAI"
requires-python = ">=3.10,<3.14"
dependencies = [
  "crewai[tools]>=1.14.0,<2.0.0",
  "supabase>=2.0.0",
]

[project.scripts]
run-crew = "envirocare_crew.main:run"

[tool.crewai]
type = "crew"

[tool.hatch.build.targets.wheel]
packages = ["src/envirocare_crew"]
