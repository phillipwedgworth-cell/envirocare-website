name: Morning Brief
# Fills the command center's Morning Brief panel: turns the proposer's ranked
# SHIP findings into a daily plain-English "what to decide today". Advises only.
# Runs after Daily Rollup (13:00 UTC) so it sees the freshest agent activity.
on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch: {}

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts
      - name: Run Morning Brief
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: node agents/morning-brief.mjs

      # Added 2026-08-24. This workflow failed silently on Aug 10, Aug 17 and
      # Aug 24 (invalid_client on the Google OAuth secret) and nothing
      # surfaced it. A failure now lands in the morning brief next day.
      - name: Report failure
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/report-failure
        with:
          agent-name: morning-brief
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-key: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
