name: EnviroCare CrewAI Analysis

on:
  # SCHEDULE DISABLED 2026-07-08 (agents audit): every scheduled run fails with
  # "working directory envirocare-crew: No such file or directory" — the
  # envirocare-crew/ folder is not checked into this repo, so the workflow can
  # never succeed. Re-enable the cron only after committing that directory.
  #   was: cron '0 12 * * 1' (Mondays noon UTC)
  # Manual trigger kept for when the directory lands.
  workflow_dispatch:

jobs:
  run-crew:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-crewai-1.14

      - name: Install CrewAI
        run: |
          pip install "crewai[tools]>=1.14.0,<2.0.0" supabase
        working-directory: envirocare-crew

      - name: Run EnviroCare Crew
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY:    ${{ secrets.GOOGLE_API_KEY }}
          SERPER_API_KEY:    ${{ secrets.SERPER_API_KEY }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL:      ${{ secrets.NOTIFY_EMAIL }}
        run: |
          pip install -e .
          python -m envirocare_crew.main
        working-directory: envirocare-crew
