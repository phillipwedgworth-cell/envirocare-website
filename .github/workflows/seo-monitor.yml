name: SEO Monitor (Local Falcon)
# Weekly Local Falcon SoLV/ARP snapshot → Supabase (seo_metrics + seo_digests),
# the data the Command Center reads. Runs agents/seo-snapshot.mjs directly, so it
# works even when the Vercel cron (/api/seo-monitor/run) is blocked by an unset
# CRON_SECRET. If you rely on the Vercel cron instead, disable this to avoid a
# duplicate weekly digest email.
# NO SCHEDULE — 2026-09-25. Despite its name this runs agents/seo-SNAPSHOT.mjs,
# not agents/seo-monitor.mjs, and seo-snapshot had FOUR Monday triggers: this
# workflow (14:00), .github/workflows/seo-snapshot.yml (14:30), and the Vercel
# cron /api/seo-monitor/run (14:00) firing once on EACH of two Vercel projects.
# agent_runs showed 4 seo-snapshot runs every Monday. The one kept is
# seo-snapshot.yml: same agent, same keys, plus failure reporting. The Vercel cron
# was removed from vercel.json. (The seo-monitor AGENT itself runs once a week,
# inside the orchestrator.) Manual runs still work below.
on:
  workflow_dispatch: {}

jobs:
  seo-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci || npm install
      - name: Run Local Falcon snapshot
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          LOCAL_FALCON_API_KEY: ${{ secrets.LOCAL_FALCON_API_KEY }}
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO:            ${{ secrets.DIGEST_TO }}
          DIGEST_FROM:          ${{ secrets.DIGEST_FROM }}
        run: node -e "import('./agents/seo-snapshot.mjs').then(m=>m.run()).catch(e=>{console.error(e);process.exit(1)})"
