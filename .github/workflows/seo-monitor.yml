name: SEO Monitor (Local Falcon)
# Weekly Local Falcon SoLV/ARP snapshot → Supabase (seo_metrics + seo_digests),
# the data the Command Center reads. Runs agents/seo-snapshot.mjs directly, so it
# works even when the Vercel cron (/api/seo-monitor/run) is blocked by an unset
# CRON_SECRET. If you rely on the Vercel cron instead, disable this to avoid a
# duplicate weekly digest email.
on:
  schedule:
    - cron: '0 14 * * 1'   # Mondays 14:00 UTC (~9am CT)
  workflow_dispatch: {}

jobs:
  seo-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci || npm install
      - name: Run Local Falcon snapshot
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          LOCAL_FALCON_API_KEY: ${{ secrets.LOCAL_FALCON_API_KEY }}
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO:            ${{ secrets.DIGEST_TO }}
          DIGEST_FROM:          ${{ secrets.DIGEST_FROM }}
        run: node -e "import('./agents/seo-snapshot.mjs').then(m=>m.run()).catch(e=>{console.error(e);process.exit(1)})"
