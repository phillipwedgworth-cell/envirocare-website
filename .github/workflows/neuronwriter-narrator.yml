# ─── CLAUDE CODE: DEPLOY THIS FILE ───
# Repo: phillipwedgworth-cell/envirocare-website (PUBLIC)
# Path: .github/workflows/neuronwriter-narrator.yml
# Commit: feat(agent): neuron narrator auto-runs on upload (write + push, scores in NeuronWriter)
# Push: main
# ─────────────────────────────────────
#
# RUNS BY ITSELF the moment these files are committed to main. Also runs on the
# button and every Monday. The agent writes a compliant draft for every query,
# pushes it into the NeuronWriter editor, and each draft shows its score IN
# NeuronWriter. You just open NeuronWriter and look at the rankings.
#
# Uses NEURONWRITER_API_KEY + ANTHROPIC_API_KEY (already GitHub secrets). No setup.

name: Neuron Narrator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "agents/neuronwriter-narrator.mjs"
      - "agents/lib/compliance.mjs"
      - "agents/neuronwriter-content/**"
      - ".github/workflows/neuronwriter-narrator.yml"
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC

jobs:
  fill:
    name: Write + push every draft into NeuronWriter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Auto-write compliant drafts and push to editors
        env:
          NEURONWRITER_API_KEY: ${{ secrets.NEURONWRITER_API_KEY }}
          NEURONWRITER_PROJECT: 9d0bec3a70f4743c
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
        run: node agents/neuronwriter-narrator.mjs fill
