# CLAUDE CODE: DEPLOY THIS FILE
# Repo: phillipwedgworth-cell/envirocare-website (PUBLIC)
# Path: .github/workflows/neuronwriter-narrator.yml  | Push: main
#
# CADENCE (Jun 25, 2026):
#   - push to agents/neuronwriter-content/** or narrator code -> FILL now (today's run)
#   - daily 13:00 UTC  -> SCORE (read every query score, email ranking; no tokens, no quota)
#   - Monday 14:00 UTC -> FILL (write/push/lift drafts)
#   - manual button    -> input "mode" (fill or score), defaults to fill
#
# FILL writes a compliant draft for every EXISTING NeuronWriter query, pushes it, reads the
# score, rewrites once if below floor. It does NOT create new queries, so it never hits the
# monthly new-query quota. New-city queries must be created in NeuronWriter first; their drafts
# are already staged in agents/neuronwriter-content/.
# NOTE: writes INTO NeuronWriter for scoring only. Does NOT publish to the live website.
#
# Uses NEURONWRITER_API_KEY + ANTHROPIC_API_KEY (already GitHub secrets).

name: Neuron Narrator

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "fill or score"
        default: "fill"
        required: false
  push:
    branches:
      - main
    paths:
      - "agents/neuronwriter-narrator.mjs"
      - "agents/lib/compliance.mjs"
      - "agents/neuronwriter-content/**"
      - ".github/workflows/neuronwriter-narrator.yml"
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 14 * * 1"

jobs:
  narrator:
    name: Neuron Narrator
    runs-on: ubuntu-latest
    env:
      MODE: "${{ (github.event_name == 'schedule' && github.event.schedule == '0 13 * * *') && 'score' || (github.event_name == 'workflow_dispatch' && inputs.mode) || 'fill' }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run narrator
        env:
          NEURONWRITER_API_KEY: ${{ secrets.NEURONWRITER_API_KEY }}
          NEURONWRITER_PROJECT: 9d0bec3a70f4743c
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # watchdog heartbeat — logRunREST writes one agent_runs row per run
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
        run: node agents/neuronwriter-narrator.mjs "$MODE"
