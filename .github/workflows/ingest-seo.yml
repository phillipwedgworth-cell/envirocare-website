name: Ingest SEO (GSC + GA4)

on:
  schedule:
    - cron: "20 11 * * 1"   # Mondays 11:20 UTC (~6:20am Central)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
      GSC_SITE_URL: "sc-domain:envirocarellc.com"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci || npm install
      - name: Ping GSC (verify OAuth token)
        run: node agents/ingest-gsc.mjs --ping
      - name: Ingest Google Search Console
        run: node agents/ingest-gsc.mjs
      - name: Ingest GA4
        run: node agents/ingest-ga4.mjs
      - name: Commit refreshed GA4 snapshot
        run: |
          git config user.name "envirocare-bot"
          git config user.email "bot@envirocarellc.com"
          git add monitoring/ga4-latest.json monitoring/ga4-history.csv || true
          git commit -m "chore(seo): weekly GA4 snapshot" || echo "no changes"
          git push || echo "nothing to push"
