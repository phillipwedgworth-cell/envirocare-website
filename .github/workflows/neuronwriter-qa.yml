name: NeuronWriter QA

on:
  schedule:
    - cron: '0 13 * * 1'   # Every Monday 13:00 UTC = 7am CT
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if not Monday (bypass weekly gate)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  neuronwriter-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # NeuronWriter new-query analysis is ~2.5 min/batch; 15 pages @ concurrency 3 ≈ 13 min

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts

      - name: Run NeuronWriter QA
        continue-on-error: true   # NW analysis / Anthropic synthesis can fail (cap, plan limits); don't red the run — scores still upload via the artifact step
        env:
          NEURONWRITER_API_KEY: ${{ secrets.NEURONWRITER_API_KEY }}
          NEURONWRITER_PROJECT: 9d0bec3a70f4743c   # envirocarellc.com project ID (not the domain)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}   # lib reads SUPABASE_KEY — without this, QA run-logging silently no-ops
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_AGENT_DB_ID: ${{ secrets.NOTION_AGENT_DB_ID }}
          FORCE_NEURONWRITER: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: node agents/neuronwriter-qa.mjs --all

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neuronwriter-report
          path: agents/reports/neuronwriter-*.md
          retention-days: 30
          if-no-files-found: ignore
