name: Agent Watchdog
on:
  schedule:
    - cron: '0 14 * * *'   # daily 14:00 UTC = 9am CT (after Mon QA + Tue optimize)
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - run: node agents/watchdog.mjs
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}   # lib reads SUPABASE_KEY (this is the name that matters)
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          NOTIFY_FROM:          ${{ secrets.NOTIFY_FROM }}
          NOTIFY_EMAIL:         ${{ secrets.NOTIFY_EMAIL }}
          ALERT_EMAIL:          ${{ secrets.ALERT_EMAIL }}
          VERCEL_TOKEN:         ${{ secrets.VERCEL_TOKEN }}        # optional: enables Vercel deploy/cost check
          VERCEL_PROJECT_ID:    prj_bD63HstQIuOMn5cEGDK4RAW7yM2F
          VERCEL_TEAM_ID:       envirocare-50d39ae8
          # GA4 daily-collection check (ga4Check in agents/watchdog.mjs). Same OAuth
          # credentials agents/ingest-ga4.mjs uses. WITHOUT these the check does not
          # fail — it reports "skipped — GA4 collection is UNMONITORED", which is the
          # state that let the Aug 2026 outage run ~9 days unnoticed.
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GA4_PROPERTY_ID:      ${{ secrets.GA4_PROPERTY_ID }}
          DAILY_USD_BUDGET:     "5"
          DEPLOY_ANOMALY:       "12"
