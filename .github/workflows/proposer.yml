name: Proposer

on:
  # NO SCHEDULE — 2026-09-24. The orchestrator already runs the proposer itself
  # (agents/orchestrator.mjs, "Round 2b"), right after the agents run and on
  # their fresh findings, then leads the Monday digest with it. A separate
  # Mon 11:30 cron here proposed from last week's findings and was then re-run
  # 30 minutes later by the orchestrator: two proposal batches every Monday —
  # the same near-duplicate problem that piled 81 approved, 0 shipped rows into
  # approval_queue. (Before that it ran daily.) Manual runs still work below.
  workflow_dispatch: {}

concurrency:
  group: proposer
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run proposer
        env:
          # All four Supabase names, normalized (fallbacks cover secrets that
          # may not exist — SUPABASE_KEY is the canonical repo secret).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/proposer.mjs
