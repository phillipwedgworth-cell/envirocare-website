name: Proposer

on:
  schedule:
    # Mondays 06:30 CT (11:30 UTC during CDT). Was daily: it produced
    # near-duplicate seasonal posts every day that piled up unshipped in
    # approval_queue (81 approved, 0 shipped on 2026-09-24).
    #
    # NOTE — this runs scripts/proposer.mjs, the GBP POST WRITER. It is NOT the
    # same program as agents/proposer.mjs, which the orchestrator runs to turn
    # findings into a site/SEO change list and which never touches
    # approval_queue. They share a name, not a job; do not dedupe one against the
    # other. (A 2026-09-24 commit briefly did exactly that and was reverted.)
    - cron: "30 11 * * 1"
  workflow_dispatch: {}

concurrency:
  group: proposer
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run proposer
        env:
          # All four Supabase names, normalized (fallbacks cover secrets that
          # may not exist — SUPABASE_KEY is the canonical repo secret).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/proposer.mjs
