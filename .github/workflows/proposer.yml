name: Proposer

on:
  # RETIRED 2026-09-27 (agent consolidation, claude/EnviroCare-Agent-Consolidation-Plan-Sep27.md).
  # Schedule removed; manual runs still work. Re-scheduling requires adding it to agents/ROSTER.json.
  # (scripts/proposer.mjs, the GBP post writer. Per Phillip 2026-09-27, posts are drafted
  #  in OneUp and approved there; the approval_queue path is retired.)
  workflow_dispatch: {}

concurrency:
  group: proposer
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run proposer
        env:
          # All four Supabase names, normalized (fallbacks cover secrets that
          # may not exist — SUPABASE_KEY is the canonical repo secret).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/proposer.mjs
