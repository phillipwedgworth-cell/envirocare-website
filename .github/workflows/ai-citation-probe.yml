name: AI Citation Probe

on:
  schedule:
    - cron: '0 13 15 * *'   # 15th of each month, 13:00 UTC = 7am CT (matches the AI-visibility monthly cadence)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Only probe the first N prompts (blank = all 25)'
        required: false
        default: ''

permissions:
  contents: write   # commits agents/reports/ai-citations-latest.json

jobs:
  ai-citation-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts

      - name: Run AI citation probe
        continue-on-error: true   # an engine outage shouldn't red the run; partial results still commit
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}   # optional — probe skips Perplexity if unset
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
        run: |
          export PROBE_DATE="$(date -u +%Y-%m-%d)"
          node agents/ai-citation-probe.mjs ${{ github.event.inputs.limit && format('--limit {0}', github.event.inputs.limit) || '' }}

      - name: Commit snapshot
        if: always()
        run: |
          git config user.name "envirocare-bot"
          git config user.email "bot@envirocarellc.com"
          git add agents/reports/ai-citations-latest.json || true
          git commit -m "chore(ai-visibility): monthly AI-citation snapshot" || echo "no changes to commit"
          git push || echo "nothing to push"

      - name: Upload snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-citations-report
          path: agents/reports/ai-citations-latest.json
          retention-days: 90
          if-no-files-found: ignore
