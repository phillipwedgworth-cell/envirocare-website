name: AI Citation Probe

on:
  schedule:
    - cron: '0 13 15 * *'   # 15th of each month, 13:00 UTC = 7am CT (matches the AI-visibility monthly cadence)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Only probe the first N prompts (blank = all 25)'
        required: false
        default: ''

permissions:
  contents: write   # commits agents/reports/ai-citations-latest.json

jobs:
  ai-citation-probe:
    runs-on: ubuntu-latest
    # 45, not 20: gpt-5-search-api allows ~6000 tokens/min and one web-search answer
    # spends nearly all of it, so 25 prompts pace out to roughly a call a minute once
    # the 429 backoff is honoured -- which does not fit in 20.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts

      # No continue-on-error: the probe now judges its own run. One engine down still
      # exits 0 and commits partial results; it exits 1 only when the run is junk --
      # too few cells overall, or any single engine below half its own calls.
      - name: Run AI citation probe
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
        run: |
          export PROBE_DATE="$(date -u +%Y-%m-%d)"
          node agents/ai-citation-probe.mjs ${{ github.event.inputs.limit && format('--limit {0}', github.event.inputs.limit) || '' }}

      - name: Commit snapshot
        if: always()
        run: |
          git config user.name "envirocare-bot"
          git config user.email "bot@envirocarellc.com"
          git add agents/reports/ai-citations-latest.json || true
          git commit -m "chore(ai-visibility): monthly AI-citation snapshot" || echo "no changes to commit"
          git push || echo "nothing to push"

      - name: Upload snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-citations-report
          path: |
            agents/reports/ai-citations-latest.json
            agents/reports/ai-citations-latest-FAILED.json
          retention-days: 90
          if-no-files-found: ignore
